<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Gestión de Usuarios</title>

    <!-- Bootstrap para mejorar la apariencia -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <!-- Título principal -->
    <h1>Gestión de Usuarios</h1>

    <hr>

    <!-- Botón para registrar nuevos usuarios -->
    <a href="/usuarios/nuevo"
       class="btn btn-primary mb-3">

        Nuevo Usuario

    </a>

    <!-- Tabla de usuarios -->
    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

            <!-- Recorre todos los usuarios enviados desde el Controller -->
            <tr th:each="usuario : ${usuarios}">

                <td th:text="${usuario.id}"></td>

                <td th:text="${usuario.nombre}"></td>

                <td th:text="${usuario.apellido}"></td>

                <td th:text="${usuario.username}"></td>

                <td th:text="${usuario.correo}"></td>

                <td th:text="${usuario.rol}"></td>

                <td>

                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                       class="btn btn-warning btn-sm">

                       Editar

                    </a>

                    <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                       class="btn btn-danger btn-sm">

                       Eliminar

                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>
</html>
