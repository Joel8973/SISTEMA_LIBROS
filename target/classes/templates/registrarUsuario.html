<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Registrar Usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h1>Registrar Usuario</h1>
    <hr>

    <!-- Mensaje de error -->
    <div th:if="${error}"
         class="alert alert-danger">

        <span th:text="${error}"></span>

    </div>

    <form
            th:action="@{/usuarios/guardar}"
            th:object="${usuario}"
            method="post"
            class="needs-validation"
            novalidate>

        <!-- Nombre -->
        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                    type="text"
                    th:field="*{nombre}"
                    class="form-control"
                    required
                    minlength="2"
                    maxlength="50"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">

            <div class="invalid-feedback">
                Ingrese solo letras (mínimo 2 caracteres).
            </div>

        </div>

        <!-- Apellido -->
        <div class="mb-3">

            <label class="form-label">
                Apellido
            </label>

            <input
                    type="text"
                    th:field="*{apellido}"
                    class="form-control"
                    required
                    minlength="2"
                    maxlength="50"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+">

            <div class="invalid-feedback">
                Ingrese solo letras (mínimo 2 caracteres).
            </div>

        </div>

        <!-- Correo -->
        <div class="mb-3">

            <label class="form-label">
                Correo Electrónico
            </label>

            <input
                    type="email"
                    th:field="*{correo}"
                    class="form-control"
                    required>

            <div class="invalid-feedback">
                Ingrese un correo válido.
            </div>

        </div>

        <!-- Teléfono -->
        <div class="mb-3">

            <label class="form-label">
                Teléfono
            </label>

            <input
                    type="text"
                    th:field="*{telefono}"
                    class="form-control"
                    required
                    pattern="[0-9]{10}"
                    maxlength="10">

            <div class="invalid-feedback">
                Debe ingresar exactamente 10 dígitos.
            </div>

        </div>

        <!-- Usuario -->
        <div class="mb-3">

            <label class="form-label">
                Nombre de Usuario
            </label>

            <input
                    type="text"
                    th:field="*{username}"
                    class="form-control"
                    required
                    minlength="4"
                    maxlength="20">

            <div class="invalid-feedback">
                Debe tener entre 4 y 20 caracteres.
            </div>

        </div>

        <!-- Contraseña -->
        <div class="mb-3">

            <label class="form-label">
                Contraseña
            </label>

            <input
                    type="password"
                    th:field="*{password}"
                    class="form-control"
                    required
                    minlength="6"
                    maxlength="20">

            <div class="invalid-feedback">
                La contraseña debe tener mínimo 6 caracteres.
            </div>

        </div>

        <!-- Rol -->
        <div class="mb-3">

            <label class="form-label">
                Rol
            </label>

            <select
                    th:field="*{rol}"
                    class="form-select"
                    required>

                <option value="">
                    Seleccione un rol
                </option>

                <option value="ADMIN">
                    Administrador
                </option>

                <option value="BIBLIOTECARIO">
                    Bibliotecario
                </option>

                <option value="USUARIO">
                    Usuario
                </option>

            </select>

            <div class="invalid-feedback">
                Debe seleccionar un rol.
            </div>

        </div>

        <button
                type="submit"
                class="btn btn-success">

            Guardar

        </button>

        <a href="/usuarios"
           class="btn btn-secondary">

            Volver

        </a>

    </form>

</div>

<script>

(() => {
    'use strict';

    const forms = document.querySelectorAll('.needs-validation');

    Array.from(forms).forEach(form => {

        form.addEventListener('submit', event => {

            if (!form.checkValidity()) {

                event.preventDefault();
                event.stopPropagation();

            }

            form.classList.add('was-validated');

        }, false);

    });

})();

</script>

</body>
</html>
